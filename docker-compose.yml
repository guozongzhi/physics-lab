services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:////data/physics_lab.db
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中配置 JWT_SECRET}
      NFC_UID_SECRET: ${NFC_UID_SECRET:-}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STUDENT_DEFAULT_PASSWORD: ${STUDENT_DEFAULT_PASSWORD}
    volumes:
      - db-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        # 浏览器访问的源；与宿主机端口一致（改 WEB_PORT 或换域名需同步改这里并重 build）
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  db-data:
