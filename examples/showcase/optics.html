<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追踪一束光的旅程</title><style>*{box-sizing:border-box}body{margin:0;background:#020617;color:#f8fafc;font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:28px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#67e8f9}h1{font-size:clamp(24px,4vw,34px);line-height:1.3;margin:12px 0}p{margin:0;color:#94a3b8}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;margin-top:26px}.scene,.controls{background:linear-gradient(135deg,#0f172a,#172554);border:1px solid #334155;border-radius:20px;overflow:hidden;min-width:0}svg{display:block;width:100%;height:auto}svg text{font-family:inherit}.controls{background:#0f172a;padding:24px;display:flex;flex-direction:column;gap:22px}.controls h2{font-size:16px;margin:0}.control{display:block}.control>span{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.control b,output{color:#67e8f9;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#22d3ee;cursor:pointer}input[type=checkbox]{accent-color:#22d3ee;width:17px;height:17px;vertical-align:middle;margin-right:8px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #334155;padding:18px 8px;gap:8px;text-align:center;font-size:12px;color:#94a3b8}.stats output{display:block;font-size:24px;font-weight:700;color:#f8fafc}.stats output.accent{color:#67e8f9}button{font:inherit;cursor:pointer;border:1px solid #475569;border-radius:12px;padding:10px 12px;background:transparent;color:#f8fafc}button.primary{background:#22d3ee;color:#082f49;border-color:#22d3ee;font-weight:700}button:hover{filter:brightness(1.15)}:focus-visible{outline:3px solid #38bdf8;outline-offset:4px}.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}.notes article{border:1px solid #1e293b;border-radius:16px;background:#0f172a;padding:18px}.notes h2{font-size:15px;color:#67e8f9;margin:0 0 10px}.notes p{font-size:13px;color:#cbd5e1}footer{font-size:11px;color:#64748b;margin-top:18px}.ray{stroke-dasharray:12 7;animation:travel 1.2s linear infinite}.glow{animation:glow 2s ease-in-out infinite}.field{stroke-dasharray:8 6;animation:travel 1.5s linear infinite}@keyframes travel{to{stroke-dashoffset:-38}}@keyframes glow{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.ray,.glow,.field{animation:none}}@media(max-width:480px){.notes{grid-template-columns:1fr}}@media(max-width:720px){main{padding:18px}.layout{grid-template-columns:1fr;gap:14px;margin-top:18px}.controls{padding:18px;gap:18px}.stats output{font-size:21px}.eyebrow{font-size:10px}}</style></head><body><main><div class="eyebrow">✧ INTERACTIVE PHYSICS LAB</div><h1>追踪一束光的旅程</h1><p>admin · 平台公共演示 · 折射 / 色散 / 斯涅尔定律</p><div class="layout"><section class="scene"><svg viewBox="0 0 600 360" role="img" aria-label="光学折射与色散动态示意"><defs><linearGradient id="medium"><stop stop-color="#164e63" stop-opacity=".7"/><stop offset="1" stop-color="#1e3a8a" stop-opacity=".3"/></linearGradient></defs><rect y="180" width="600" height="180" fill="url(#medium)"/><path d="M0 180H600" stroke="#67e8f9" stroke-width="2"/><path id="normalLine" d="M300 25V340" stroke="#94a3b8" stroke-dasharray="7 7"/><text x="22" y="32" fill="#cbd5e1" font-size="14">空气 n₁ = 1.00</text><text id="mediumLabel" x="22" y="330" fill="#67e8f9" font-size="14"></text><path id="incidentRay" stroke="white" stroke-width="4" fill="none"/><path id="reflectionRay" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" fill="none"/><g id="spectrum"></g><path id="photon" class="ray" stroke="white" stroke-width="2" opacity=".7" fill="none"/><circle class="glow" cx="300" cy="180" r="5" fill="#fef9c3"/><text id="incidentLabel" x="325" y="140" fill="white" font-size="14"></text><text id="refractionLabel" x="320" y="245" fill="#67e8f9" font-size="14"></text><text x="360" y="45" fill="#94a3b8" font-size="12">虚线：反射光</text></svg><div class="stats"><div>入射角<output id="incidentOut"></output></div><div>折射角<output class="accent" id="refractionOut" aria-label="折射角读数"></output></div><div>光速 v/c<output id="speedOut"></output></div></div></section><section class="controls" aria-label="实验控制台"><h2>实验控制台</h2><label class="control"><span>入射角<b id="incidentValue">45°</b></span><input id="incident" aria-label="入射角" type="range" min="0" max="75" value="45" step="1"></label><label class="control"><span>介质折射率<b id="indexValue">1.5</b></span><input id="index" aria-label="介质折射率" type="range" min="1.1" max="2" value="1.5" step="0.05"></label><label><input id="dispersion" type="checkbox" checked>显示色散光谱</label><label><input id="normal" type="checkbox" checked>显示法线</label><button id="reset">↺ 恢复默认参数</button></section></div><div class="notes"><article><h2>01 · 原理</h2><p>n₁ sin i = n₂ sin r；光从空气进入折射率更高的介质时，向法线偏折。</p></article><article><h2>02 · 试一试</h2><p>增大入射角，再提高折射率，观察折射角的变化；垂直入射时不偏折。</p></article><article><h2>03 · 色散</h2><p>不同颜色对应不同折射率，紫光偏折更明显。光谱间距为示意。</p></article></div><footer>教学模拟，仅用于观察物理关系。色散采用示意折射率偏移；反射光未按菲涅耳公式计算强度。</footer></main><script>const $=id=>document.getElementById(id);const rad=Math.PI/180;const colors=['#fb7185','#fb923c','#fde047','#4ade80','#38bdf8','#a78bfa'];function update(){const i=+$('incident').value,n=+$('index').value,r=Math.asin(Math.sin(i*rad)/n)/rad;const incoming='M'+(300-165*Math.sin(i*rad))+' '+(180-165*Math.cos(i*rad))+' L300 180';$('incidentValue').textContent=i+'°';$('indexValue').textContent=n.toFixed(2);$('incidentOut').textContent=i+'°';$('refractionOut').textContent=r.toFixed(1)+'°';$('speedOut').textContent=(1/n).toFixed(2);$('mediumLabel').textContent='透明介质 n₂ = '+n.toFixed(2);$('incidentLabel').textContent='入射 '+i+'°';$('refractionLabel').textContent='折射 '+r.toFixed(1)+'°';$('normalLine').style.display=$('normal').checked?'':'none';$('incidentRay').setAttribute('d',incoming);$('photon').setAttribute('d',incoming+' L'+(300+180*Math.sin(r*rad))+' '+(180+180*Math.cos(r*rad)));$('reflectionRay').setAttribute('d','M300 180 L'+(300+160*Math.sin(i*rad))+' '+(180-160*Math.cos(i*rad)));const dispersion=$('dispersion').checked;const paths=(dispersion?colors:['#ffffff']).map((color,k)=>{const nk=dispersion?n+(k-2.5)*.025:n;const rk=Math.asin(Math.sin(i*rad)/nk);return '<path d="M300 180 L'+(300+180*Math.sin(rk))+' '+(180+180*Math.cos(rk))+'" stroke="'+color+'" stroke-width="'+(dispersion?2.5:4)+'" fill="none"/>'});$('spectrum').innerHTML=paths.join('')}['incident','index','normal','dispersion'].forEach(id=>$(id).addEventListener('input',update));$('reset').onclick=()=>{$('incident').value=45;$('index').value=1.5;$('normal').checked=true;$('dispersion').checked=true;update()};update();</script></body></html>
