<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>让线圈开始转动</title><style>*{box-sizing:border-box}body{margin:0;background:#020617;color:#f8fafc;font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1180px;margin:auto;padding:28px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#67e8f9}h1{font-size:clamp(24px,4vw,34px);line-height:1.3;margin:12px 0}p{margin:0;color:#94a3b8}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;margin-top:26px}.scene,.controls{background:linear-gradient(135deg,#0f172a,#172554);border:1px solid #334155;border-radius:20px;overflow:hidden;min-width:0}svg{display:block;width:100%;height:auto}svg text{font-family:inherit}.controls{background:#0f172a;padding:24px;display:flex;flex-direction:column;gap:22px}.controls h2{font-size:16px;margin:0}.control{display:block}.control>span{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}.control b,output{color:#67e8f9;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#22d3ee;cursor:pointer}input[type=checkbox]{accent-color:#22d3ee;width:17px;height:17px;vertical-align:middle;margin-right:8px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid #334155;padding:18px 8px;gap:8px;text-align:center;font-size:12px;color:#94a3b8}.stats output{display:block;font-size:24px;font-weight:700;color:#f8fafc}.stats output.accent{color:#67e8f9}button{font:inherit;cursor:pointer;border:1px solid #475569;border-radius:12px;padding:10px 12px;background:transparent;color:#f8fafc}button.primary{background:#22d3ee;color:#082f49;border-color:#22d3ee;font-weight:700}button:hover{filter:brightness(1.15)}:focus-visible{outline:3px solid #38bdf8;outline-offset:4px}.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}.notes article{border:1px solid #1e293b;border-radius:16px;background:#0f172a;padding:18px}.notes h2{font-size:15px;color:#67e8f9;margin:0 0 10px}.notes p{font-size:13px;color:#cbd5e1}footer{font-size:11px;color:#64748b;margin-top:18px}.ray{stroke-dasharray:12 7;animation:travel 1.2s linear infinite}.glow{animation:glow 2s ease-in-out infinite}.field{stroke-dasharray:8 6;animation:travel 1.5s linear infinite}@keyframes travel{to{stroke-dashoffset:-38}}@keyframes glow{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.ray,.glow,.field{animation:none}}@media(max-width:720px){main{padding:18px}.layout{grid-template-columns:1fr;gap:14px;margin-top:18px}.controls{padding:18px;gap:18px}.notes{grid-template-columns:1fr}.stats output{font-size:21px}.eyebrow{font-size:10px}}</style></head><body><main><div class="eyebrow">✧ INTERACTIVE PHYSICS LAB</div><h1>让线圈开始转动</h1><p>admin · 平台公共演示 · 磁场 / 电流 / 换向器</p><div class="layout"><section class="scene"><svg viewBox="0 0 600 360" role="img" aria-label="直流电机线圈动态示意"><defs><linearGradient id="copper"><stop stop-color="#fb923c"/><stop offset=".5" stop-color="#fde68a"/><stop offset="1" stop-color="#ea580c"/></linearGradient></defs><rect x="35" y="95" width="100" height="170" rx="18" fill="#be123c"/><text x="73" y="195" fill="white" font-size="36" font-weight="bold">N</text><rect x="465" y="95" width="100" height="170" rx="18" fill="#1d4ed8"/><text x="503" y="195" fill="white" font-size="36" font-weight="bold">S</text><g id="fieldLines"><path class="field" d="M150 115H450 l-12 -6 m12 6 l-12 6" stroke="#38bdf8" stroke-width="2" fill="none"/><path class="field" d="M150 180H450 l-12 -6 m12 6 l-12 6" stroke="#38bdf8" stroke-width="2" fill="none"/><path class="field" d="M150 245H450 l-12 -6 m12 6 l-12 6" stroke="#38bdf8" stroke-width="2" fill="none"/></g><path d="M300 45V300" stroke="#64748b" stroke-width="8"/><g id="coil"><rect x="-105" y="-65" width="210" height="130" rx="18" fill="none" stroke="url(#copper)" stroke-width="3"/><rect x="-100" y="-61" width="200" height="122" rx="18" fill="none" stroke="url(#copper)" stroke-width="3"/><rect x="-95" y="-57" width="190" height="114" rx="18" fill="none" stroke="url(#copper)" stroke-width="3"/><rect x="-90" y="-53" width="180" height="106" rx="18" fill="none" stroke="url(#copper)" stroke-width="3"/><rect x="-85" y="-49" width="170" height="98" rx="18" fill="none" stroke="url(#copper)" stroke-width="3"/></g><circle cx="300" cy="180" r="12" fill="#cbd5e1"/><path d="M250 310H215V340H385V310H350" fill="none" stroke="#fbbf24" stroke-width="3"/><rect x="280" y="290" width="18" height="32" rx="5" fill="#fb923c"/><rect x="302" y="290" width="18" height="32" rx="5" fill="#fbbf24"/><text x="25" y="30" fill="#94a3b8" font-size="13">正视图 · 理想换向器模型</text><text x="330" y="305" fill="#fde68a" font-size="12">换向器 / 电刷</text><text id="directionLabel" x="225" y="75" fill="#67e8f9" font-size="14"></text></svg><div class="stats"><div>转角<output id="angleOut" aria-label="电机转角读数"></output></div><div>瞬时力矩<output class="accent" id="torqueOut" aria-label="力矩读数"></output></div><div>状态<output id="stateOut" style="font-size:16px"></output></div></div></section><section class="controls" aria-label="实验控制台"><h2>实验控制台</h2><label class="control"><span>电流<b id="currentValue">2 A</b></span><input id="current" aria-label="电流" type="range" min="0" max="5" value="2" step="0.5"></label><label class="control"><span>磁感应强度<b id="fieldValue">0.5 T</b></span><input id="field" aria-label="磁感应强度" type="range" min="0" max="1" value="0.5" step="0.1"></label><label class="control"><span>线圈转角 θ<b id="angleValue">90°</b></span><input id="angle" aria-label="线圈转角 θ" type="range" min="0" max="359" value="90" step="1"></label><label><input id="reverse" type="checkbox">反转电流方向</label><button class="primary" id="toggle" aria-pressed="false">▷ 开始演示</button><button id="reset">↺ 恢复默认参数</button></section></div><div class="notes"><article><h2>01 · 原理</h2><p>τ = NIAB |sin θ|。θ 为线圈法线与磁场夹角；20 匝、面积 0.01 m²。</p></article><article><h2>02 · 试一试</h2><p>把电流或磁场调为 0，观察驱动力消失；反转电流，观察旋转方向改变。</p></article><article><h2>03 · 换向器</h2><p>每半圈切换线圈电流，使驱动力保持同向。动画转速仅供演示。</p></article></div><footer>教学模拟，仅用于观察物理关系。转速未求解惯性、摩擦或反电动势，不代表真实电机动力学。</footer></main><script>const $=id=>document.getElementById(id);let angle=90,running=false,last=0;function update(){const current=+$('current').value,field=+$('field').value;const torque=20*current*.01*field*Math.abs(Math.sin(angle*Math.PI/180));$('currentValue').textContent=current.toFixed(1)+' A';$('fieldValue').textContent=field.toFixed(1)+' T';$('angleValue').textContent=Math.round(angle)+'°';$('angle').value=Math.round(angle);$('angleOut').textContent=angle.toFixed(0)+'°';$('torqueOut').textContent=torque.toFixed(3)+' N·m';$('stateOut').textContent=current===0||field===0?'无驱动力':running?'运行中':'已暂停';$('coil').setAttribute('transform','translate(300 180) scale('+Math.sin(angle*Math.PI/180)+' 1)');$('directionLabel').textContent=$('reverse').checked?'反向电流 ↶':'正向电流 ↷';$('fieldLines').style.opacity=field>0?.7:.15;$('toggle').textContent=running?'Ⅱ 暂停演示':'▷ 开始演示';$('toggle').setAttribute('aria-pressed',String(running))}function tick(now){if(last&&running){angle=(angle+($('reverse').checked?-1:1)*Math.min(now-last,50)*+$('current').value*+$('field').value*.12+360)%360;update()}last=now;requestAnimationFrame(tick)}['current','field','reverse'].forEach(id=>$(id).addEventListener('input',update));$('angle').oninput=()=>{running=false;angle=+$('angle').value;update()};$('toggle').onclick=()=>{running=!running;last=0;update()};$('reset').onclick=()=>{running=false;angle=90;last=0;$('current').value=2;$('field').value=.5;$('reverse').checked=false;update()};update();requestAnimationFrame(tick);</script></body></html>
